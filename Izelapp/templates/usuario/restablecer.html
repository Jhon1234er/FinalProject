{% extends 'componentes/Base.html' %}
{% load static %}

{% block title %}Restablecer contraseña - Izel{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/restablecer.css' %}">

<div class="Restablecer__contenedor">
  <div class="Restablecer__formulario">
    <h2 class="Restablecer__titulo">Establecer nueva contraseña</h2>
    
    <form method="post">
      {% csrf_token %}

      <!-- Campo nueva contraseña con mostrar/ocultar -->
      <div class="Restablecer__campo">
        <input type="password" id="nueva_password" name="password" required placeholder=" ">
        <label for="nueva_password">Nueva contraseña</label>
        <img src="{% static 'img/Mostrar.svg' %}" class="toggle-password" id="togglePasswordIcon" alt="Mostrar contraseña">
      </div>

      <!-- Campo confirmar contraseña (no se puede ver ni pegar) -->
      <div class="Restablecer__campo">
        <input type="password" id="confirmar_password" name="confirm_password" required 
               placeholder=" " onpaste="return false;" oncopy="return false;" oncut="return false;" autocomplete="off">
        <label for="confirmar_password">Confirmar contraseña</label>
      </div>

      <!-- Mensaje de error -->
      <p id="error-texto" class="Restablecer__error"></p>

      <!-- Botón -->
      <button type="submit" class="animated-button">
        <svg xmlns="http://www.w3.org/2000/svg" class="arr-2" viewBox="0 0 24 24">
          <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z" />
        </svg>
        <span class="text">Guardar contraseña</span>
        <span class="circle"></span>
        <svg xmlns="http://www.w3.org/2000/svg" class="arr-1" viewBox="0 0 24 24">
          <path d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z" />
        </svg>
      </button>
    </form>
  </div>
</div>

<!-- Script para validación y mostrar/ocultar contraseña -->
<script>
  // Validación de coincidencia de contraseñas
  document.querySelector('form').addEventListener('submit', function (e) {
    const pass = document.getElementById("nueva_password").value;
    const confirm = document.getElementById("confirmar_password").value;
    const errorText = document.getElementById("error-texto");

    if (pass !== confirm) {
      e.preventDefault();
      errorText.textContent = "Las contraseñas no coinciden.";
    }
  });

  // Mostrar/Ocultar contraseña
  const toggleIcon = document.getElementById('togglePasswordIcon');
  const passwordInput = document.getElementById('nueva_password');

  toggleIcon.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    toggleIcon.src = isPassword ? "{% static 'img/Ocultar.svg' %}" : "{% static 'img/Mostrar.svg' %}";
    toggleIcon.alt = isPassword ? "Ocultar contraseña" : "Mostrar contraseña";
  });
</script>
{% endblock %}
