{% extends 'componentes/Base.html' %}
{% load static %}

{% block title %}Contraseña restablecida - Izel{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/restablecer_exito.css' %}">
{% endblock %}

{% block content %}
<div class="card">
  <button class="dismiss" type="button">×</button> 
  <div class="header"> 
    <div class="div_image_v">
      <div class="image">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 7L9.00004 18L3.99994 13" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div> 
    </div> 
    <div class="content">
      <span class="title">¡Contraseña restablecida con éxito!</span> 
      <p class="message">Puedes iniciar sesión con tu nueva contraseña.</p> 
    </div> 
    <div style="text-align: center; margin: 1rem 0;">
      <a href="{% url 'login' %}" class="Restablecer__boton">Iniciar sesión</a>
    </div>
  </div>
</div>

<script>
  document.querySelector('.dismiss').addEventListener('click', () => {
    document.querySelector('.card').remove();
  });
</script>
{% endblock %}
