{% extends 'componentes/Base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/disponibilidad.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<div class="contenedor-disponibilidad">
  <h2>Generar Disponibilidad Médica</h2>

  <form method="POST" id="disponibilidad-form">
    {% csrf_token %}

    <div class="form-bloques-grid">
      <!-- IZQUIERDA: FORMULARIO -->
      <div class="formulario">
        <label>Selecciona los médicos:</label>
        <div id="medico-buttons">
          {% for medico in form.fields.medicos.queryset %}
            <button type="button" class="medico-btn" data-id="{{ medico.id }}">{{ medico }}</button>
          {% endfor %}
        </div>
        <input type="hidden" name="medicos_seleccionados" id="medicos_seleccionados">

        <label>Días seleccionados:</label>
        <div id="calendario-inline" class="flatpickr-calendar"></div>
        <input type="hidden" name="dias" id="dias-seleccionados">

        <label for="hora_inicio">Hora inicio diaria:</label>
        <input type="text" name="hora_inicio" id="hora_inicio" class="form-control hora-picker" required>

        <label for="hora_fin">Hora fin diaria:</label>
        <input type="text" name="hora_fin" id="hora_fin" class="form-control hora-picker" required>

        <label>Duración por cita:</label>
        <select name="duracion" class="form-control" required>
          <option value="">Selecciona duración</option>
          <option value="15">15 minutos</option>
          <option value="30">30 minutos</option>
          <option value="45">45 minutos</option>
          <option value="60">60 minutos</option>
        </select>

        <input type="submit" value="Generar Disponibilidad" class="boton-enviar">
      </div>

      <!-- DERECHA: BLOQUES GENERADOS -->
      <div class="bloques">
        <label>Bloques horarios generados:</label>
        <div id="bloques-horarios" class="contenedor-bloques"></div>

        {% if mensaje_exito %}
        <div class="alerta-exito">
          {{ mensaje_exito }}
        </div>
        {% endif %}
      </div>
    </div>
  </form>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
<script src="{% static 'js/generar_disponibilidad.js' %}"></script>

<script>
  flatpickr("#calendario-inline", {
    locale: "es",
    inline: true,
    mode: "multiple",
    dateFormat: "Y-m-d",
    minDate: "today",
    onChange: function (selectedDates, dateStr, instance) {
      const fechas = selectedDates.map(date => instance.formatDate(date, "Y-m-d"));
      document.getElementById("dias-seleccionados").value = fechas.join(',');
    }
  });

  flatpickr(".hora-picker", {
    enableTime: true,
    noCalendar: true,
    dateFormat: "h:i K",
    time_24hr: false,
    minTime: "08:00",
    maxTime: "18:00",
    allowInput: false
  });
</script>
{% endblock %}
